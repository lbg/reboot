<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const requestedPath = window.location.pathname + window.location.search + window.location.hash;
      const redirectParams = new URLSearchParams({ __reboot_redirect: requestedPath });
      window.location.replace('/reboot/?' + redirectParams.toString());
    </script>
  </head>

</html>
